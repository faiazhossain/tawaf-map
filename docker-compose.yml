services:
  tawaf-frontend:
    container_name: tawaf-frontend
    image: rilusmahmud/tawaf-map:latest
    restart: unless-stopped
    # json-file defaults grow forever on long-lived hosts; cap at ~30MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4005
    ports:
      - "127.0.0.1:4005:4005"
