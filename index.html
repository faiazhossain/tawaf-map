<!DOCTYPE html>
<html lang="en">
<head>
  <title>Clock Tower on Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "clockHands": "./clockHands.js"
    }
  }
  </script>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs';
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { attachRealtimeClockHands } from 'clockHands';

    const STYLE_URL = 'https://na-maps.vng-solutions.com/styles/spl_bgmaps/style.json';
    const CLOCK_URL = 'https://raw.githubusercontent.com/golamrabbii/3d-models/main/clock_tower_compress.glb';

    // Final map placement (targetWidthM already includes former scaleMul 1.8 → 180)
    const CFG = {
      lng: 39.826389,
      lat: 21.418889,
      offsetEast: -79,
      offsetNorth: -94,
      altitude: 0,
      rotateX: 1.6284,
      rotateY: -3.45,
      rotateZ: 0,
      widthM: 180,
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: STYLE_URL,
      zoom: 16.5,
      center: [CFG.lng, CFG.lat],
      pitch: 55,
      bearing: -20,
      maxPitch: 85,
      canvasContextAttributes: { antialias: true },
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    function prepareModel(root, widthM) {
      root.traverse((c) => {
        if (!c.isMesh) return;
        if (c.geometry) c.geometry.computeVertexNormals();
        const olds = Array.isArray(c.material) ? c.material : [c.material];
        const hasVC = !!c.geometry?.attributes?.color;
        const news = olds.map((m) => new THREE.MeshLambertMaterial({
          color: m?.color?.clone?.() ?? 0xffffff,
          vertexColors: hasVC,
          side: THREE.DoubleSide,
          map: m?.map || null,
          transparent: !!m?.transparent,
          opacity: m?.opacity ?? 1,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1,
        }));
        c.material = news.length === 1 ? news[0] : news;
      });

      let box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      root.scale.multiplyScalar(widthM / Math.max(size.x, size.y, 1e-6));
      box = new THREE.Box3().setFromObject(root);
      const c = box.getCenter(new THREE.Vector3());
      root.position.set(-c.x, -c.y, -box.min.z);
    }

    const layer = {
      id: '3d-clock-tower',
      type: 'custom',
      renderingMode: '3d',

      onAdd(map, gl) {
        this.map = map;
        this.camera = new THREE.Camera();
        this.scene = new THREE.Scene();
        // sun was 0 — removed; keep ambient + fill (final look)
        this.scene.add(new THREE.AmbientLight(0xffffff, 2.0));
        const fill = new THREE.DirectionalLight(0xffffff, 0.55);
        fill.position.set(-70, 50, -50);
        this.scene.add(fill);

        this.renderer = new THREE.WebGLRenderer({
          canvas: map.getCanvas(),
          context: gl,
          antialias: true,
        });
        this.renderer.autoClear = false;
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;

        const draco = new DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
        const loader = new GLTFLoader();
        loader.setDRACOLoader(draco);

        loader.load(CLOCK_URL, (gltf) => {
          prepareModel(gltf.scene, CFG.widthM);
          attachRealtimeClockHands(gltf.scene);
          this.scene.add(gltf.scene);
          map.triggerRepaint();
        });
      },

      render(gl, args) {
        const m = new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);
        const mc = maplibregl.MercatorCoordinate.fromLngLat([CFG.lng, CFG.lat], CFG.altitude);
        const s = mc.meterInMercatorCoordinateUnits();
        const rx = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), CFG.rotateX);
        const ry = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 1, 0), CFG.rotateY);
        const rz = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 0, 1), CFG.rotateZ);
        const l = new THREE.Matrix4()
          .makeTranslation(mc.x + CFG.offsetEast * s, mc.y - CFG.offsetNorth * s, mc.z)
          .scale(new THREE.Vector3(s, -s, s))
          .multiply(rx).multiply(ry).multiply(rz);
        this.camera.projectionMatrix = m.multiply(l);
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
        this.map.triggerRepaint();
      },
    };

    map.on('style.load', () => map.addLayer(layer));
  </script>
</body>
</html>
